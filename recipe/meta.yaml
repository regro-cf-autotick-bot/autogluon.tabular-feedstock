{% set name = "autogluon.tabular" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/autogluon/autogluon/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fb0c0565f3d4b01b357985d825fe4840c650e238179b519f419953937114149c

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install ./tabular -vv
  script_env:
    - RELEASE=1

requirements:
  build:
    # - {{ compiler('cuda') }}                 # [linux and cuda_compiler_version != "None"]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy  >=1.25.0,<2.4.0                 # [build_platform != target_platform]
  host:
    - python {{ python_min }}
    - pip
  run:
  # see deps in https://github.com/autogluon/autogluon/blob/master/tabular/setup.py
  # dep versions defined in https://github.com/autogluon/autogluon/blob/master/core/src/autogluon/core/_setup_utils.py
    - accelerate >=1.1.0,<2.0
    - autogluon.common ==1.6.0.dev0
    - autogluon.tabular ==1.6.0.dev0
    - chronos-forecasting >=2.3.1,<2.4
    - coreforecast >=0.0.12,<0.0.17
    - einops >=0.7,<1
    - fugue >=0.9.0
    - gluonts >=0.17.0,<0.18.0
    - huggingface_hub >=1.3,<2.0
    - joblib >=1.2,<1.7
    - lightning >=2.5.1,<2.7
    - mlforecast >=0.14.0,<0.15.0
    - orjson >=3.9,<4.dev0
    - peft >=0.18.1,<0.20
    - safetensors >=0.4,<1
    - statsforecast >=1.7.0,<2.1.2
    - tensorboard >=2.9,<3
    - tqdm >=4.38,<5
    - transformers >=5.3,<5.15
    - utilsforecast >=0.2.3,<0.2.12
    - python >={{ python_min }},<3.14
    - numpy >=1.25.0,<2.6.0
    - scipy >=1.5.4,<1.19
    - pandas >=2.0.0,<2.4.0
    - pytorch >=2.10,<2.14
    - scikit-learn >=1.4.0,<1.8.0
    - networkx >=3.0,<4
    - autogluon.core ==1.6.0.dev0
    - autogluon.features ==1.6.0.dev0
    - lightgbm >=4.0,<4.7
    - catboost >=1.2,<1.3
    - xgboost >=2.0,<3.2
    - fastai >=2.3.1,<2.9

test:
  imports:
    - autogluon.tabular
  commands:
    - python -c "from autogluon.tabular import __version__ as v; from packaging.version import parse; expected = '{{ version }}'; assert parse(v) == parse(expected), f'{v} != {expected}'"
  requires:
    - pip
    # - pytorch =*=cuda*  # [linux and cuda_compiler_version != "None"]

about:
  home: https://pypi.org/project/autogluon.tabular
  summary: AutoML for Image, Text, and Tabular Data
  dev_url: https://github.com/autogluon/autogluon/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shchur
    - Innixma
    - prateekdesai04
